<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReadmeHero · GitHub 封面图生成器</title>
<style>
  /* ============================================================
     ReadmeHero — 界面样式
     设计方向：玻璃质感 / Apple 风
     浅蓝灰底 + 彩色模糊光斑 + 毛玻璃卡片，通透、轻盈、高级
     布局：左侧选项内部滚动，右侧预览常驻不动
     ============================================================ */
  :root {
    --radius: 12px;
    --nav-h: 56px;
    --bg: #eef1f7;
    --text: #1b2430;
    --text-2: #5c6676;
    --text-3: #949cab;
    --surface: rgba(255,255,255,0.62);
    --surface-solid: #ffffff;
    --border: rgba(255,255,255,0.7);
    --border-2: rgba(16,24,40,0.1);
    --accent: #0a84ff;
    --accent-2: #5ab0ff;
    --accent-ring: rgba(10,132,255,0.3);
    --input-bg: rgba(255,255,255,0.7);
    --blur: 22px;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); color: var(--text); background: var(--bg);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  ::selection { background: var(--accent-ring); }

  /* 彩色模糊光斑：供毛玻璃透出，制造通透的景深 */
  .bg-decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .blob.a { width: 520px; height: 520px; background: #7cc0ff; top: -120px; left: -80px; }
  .blob.b { width: 460px; height: 460px; background: #c6a4ff; top: 20%; right: -100px; }
  .blob.c { width: 420px; height: 420px; background: #ffc2e0; bottom: -140px; left: 30%; }

  /* 侧栏滚动条 */
  .panel::-webkit-scrollbar { width: 10px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(16,24,40,0.14); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
  .panel::-webkit-scrollbar-thumb:hover { background: rgba(16,24,40,0.24); background-clip: padding-box; }

  /* ---------- 顶栏 ---------- */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    height: var(--nav-h); padding: 0 20px; position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border-2);
    background: var(--surface); backdrop-filter: saturate(180%) blur(var(--blur));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mono-mark {
    width: 25px; height: 25px; border-radius: 7px; color: #fff;
    display: grid; place-items: center; font-weight: 650; font-size: 14px; letter-spacing: -0.02em;
    background: linear-gradient(140deg, var(--accent-2), var(--accent));
    box-shadow: 0 3px 10px -2px var(--accent-ring);
  }
  .brand .nm { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sep { color: var(--border-2); }
  .brand .sub { font-size: 13.5px; color: var(--text-3); }
  .ghbtn {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500;
    color: var(--text); text-decoration: none;
    border: 1px solid var(--border-2); border-radius: 9px; padding: 6px 12px;
    background: var(--input-bg); transition: transform .16s ease, background .16s ease;
  }
  .ghbtn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.9); }
  .ghbtn:active { transform: scale(0.98); }
  .ghbtn .star { color: var(--accent); }

  /* ---------- 主体：左选项内部滚动 + 右预览常驻 ---------- */
  .app { display: grid; grid-template-columns: 324px minmax(0, 1fr); height: calc(100vh - var(--nav-h)); }

  .panel { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; backdrop-filter: saturate(180%) blur(var(--blur));
    box-shadow: 0 1px 1px rgba(255,255,255,0.5) inset, 0 8px 30px -18px rgba(16,24,40,0.5);
  }
  .card > .label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-3);
    letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > .flabel { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-2); margin-bottom: 7px; }
  .field input[type="text"], .field textarea {
    width: 100%; font-family: var(--sans); font-size: 13.5px; color: var(--text);
    background: var(--input-bg); border: 1px solid var(--border-2); border-radius: 9px;
    padding: 9px 11px; resize: none; transition: border-color .14s ease, box-shadow .14s ease;
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-3); }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .field .hint { font-size: 12px; color: var(--text-3); margin-top: 7px; line-height: 1.5; }

  .templates { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
  .tpl {
    cursor: pointer; user-select: none; text-align: center;
    border: 1px solid var(--border-2); border-radius: 9px; background: var(--input-bg);
    padding: 9px 10px; font-size: 13px; font-weight: 500; color: var(--text-2);
    transition: color .14s ease, transform .12s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .tpl:hover { color: var(--text); transform: translateY(-1px); }
  .tpl:active { transform: scale(0.98); }
  .tpl.active { color: #fff; border-color: transparent;
    background: linear-gradient(140deg, var(--accent-2), var(--accent));
    box-shadow: 0 4px 14px -4px var(--accent-ring); }

  .swatches { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--border-2); transition: transform .12s ease, box-shadow .12s ease; }
  .swatch:hover { transform: scale(1.14); }
  .swatch.active { box-shadow: 0 0 0 2px var(--surface-solid), 0 0 0 3.5px var(--text); }
  .swatch.custom { position: relative; overflow: hidden;
    background: conic-gradient(from 0deg, #ff5a36, #f59e0b, #22c55e, #0ea5e9, #6366f1, #ec4899, #ff5a36); }
  .swatch.custom input { position: absolute; inset: -8px; opacity: 0; cursor: pointer; }

  .emoji-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .emojis { display: flex; gap: 6px; flex-wrap: wrap; }
  .emoji-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border-2);
    background: var(--input-bg); font-size: 16px; cursor: pointer; line-height: 1;
    transition: transform .12s ease, box-shadow .14s ease, border-color .14s ease; }
  .emoji-btn:hover { transform: translateY(-1px); }
  .emoji-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
  .emoji-input { width: 50px !important; text-align: center; font-size: 16px !important; }

  /* ---------- 右侧预览常驻 ---------- */
  .preview-wrap {
    position: relative; display: flex; flex-direction: column; justify-content: safe center;
    padding: 28px 34px; overflow-y: auto; overflow-x: hidden;
  }
  .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .preview-head .label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); }
  .preview-head .size { font-family: var(--mono); font-size: 12px; color: var(--text-3); }

  .canvas-frame {
    position: relative; width: 100%; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border);
    background: repeating-conic-gradient(rgba(0,0,0,0.04) 0% 25%, rgba(0,0,0,0.015) 0% 50%) 50% / 20px 20px;
    box-shadow: 0 1px 1px rgba(255,255,255,0.6) inset, 0 30px 70px -30px rgba(16,24,40,0.6);
  }
  #preview { display: block; width: 100%; height: auto; }

  .actions { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans);
    font-size: 13px; font-weight: 500; padding: 10px 15px; border-radius: 9px;
    border: 1px solid var(--border-2); background: var(--surface); color: var(--text); cursor: pointer;
    backdrop-filter: blur(10px); transition: transform .14s ease, background .14s ease; }
  .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.85); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .btn .ic { color: var(--text-3); }
  .btn.primary { background: linear-gradient(140deg, var(--accent-2), var(--accent));
    border-color: transparent; color: #fff; box-shadow: 0 4px 16px -4px var(--accent-ring); }
  .btn.primary:hover { filter: brightness(1.05); background: linear-gradient(140deg, var(--accent-2), var(--accent)); }
  .btn.primary .ic { color: rgba(255,255,255,0.75); }

  .smallprint { margin-top: 20px; font-size: 12px; color: var(--text-3); }
  .smallprint .dot { margin: 0 6px; opacity: .5; }

  .toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(10px);
    background: var(--text); color: #fff; font-size: 13px; font-weight: 500;
    padding: 10px 16px; border-radius: 9px; box-shadow: 0 10px 40px -8px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .preview-wrap > * { animation: fadeUp .5s cubic-bezier(0.22,1,0.36,1) both; }
  .canvas-frame { animation-delay: .08s; } .actions { animation-delay: .16s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* ---------- 窄屏：预览吸顶常驻（不透明，防重叠），选项在下滚动 ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { display: flex; flex-direction: column; height: auto; }
    .preview-wrap {
      order: -1; position: sticky; top: var(--nav-h); z-index: 10;
      padding: 16px 16px 18px; background: var(--bg);
      border-bottom: 1px solid var(--border-2);
      box-shadow: 0 12px 22px -18px rgba(16,24,40,0.6);
    }
    .canvas-frame, .preview-head, .actions { max-width: 460px; margin-left: auto; margin-right: auto; width: 100%; }
    .smallprint { display: none; }
    .panel { overflow: visible; }
    .brand .sub, .brand .sep { display: none; }
  }
</style>
</head>
<body>

  <!-- 背景彩色光斑（毛玻璃透出用） -->
  <div class="bg-decor"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

  <!-- ============ 顶栏 ============ -->
  <nav>
    <div class="brand">
      <span class="mono-mark">H</span>
      <span class="nm">ReadmeHero</span>
      <span class="sep">/</span>
      <span class="sub">banner studio</span>
    </div>
    <a class="ghbtn" href="https://github.com/Faust-cloud/readme-hero" target="_blank" rel="noopener">
      <span class="star">★</span> Star
    </a>
  </nav>

  <main class="app">

    <!-- ============ 左侧：选项（内部滚动） ============ -->
    <aside class="panel">
      <div class="card">
        <span class="label">内容</span>
        <div class="field"><span class="flabel">项目名</span>
          <input type="text" id="in-name" value="ReadmeHero" maxlength="40" placeholder="your-project" /></div>
        <div class="field"><span class="flabel">一句话简介</span>
          <textarea id="in-subtitle" rows="2" maxlength="90">一键生成好看的 GitHub 项目封面图</textarea></div>
        <div class="field"><span class="flabel">作者 / Handle</span>
          <input type="text" id="in-author" value="@Faust-cloud" maxlength="30" placeholder="@username" /></div>
      </div>
      <div class="card">
        <span class="label">样式</span>
        <div class="field"><span class="flabel">模板</span><div class="templates" id="templates"></div></div>
        <div class="field"><span class="flabel">主色</span><div class="swatches" id="swatches"></div></div>
        <div class="field"><span class="flabel">图标 Emoji</span>
          <div class="emoji-row">
            <input type="text" id="in-emoji" class="emoji-input" value="🚀" maxlength="2" />
            <div class="emojis" id="emojis"></div>
          </div>
          <div class="hint">点一下预设，或在左框换成任意 emoji；留空则不显示。</div>
        </div>
      </div>
    </aside>

    <!-- ============ 右侧：预览（常驻） ============ -->
    <section class="preview-wrap">
      <div class="preview-head"><span class="label">预览</span><span class="size">1280 × 640</span></div>
      <div class="canvas-frame">
        <!-- 画布内部按 2 倍分辨率渲染，保证下载的图清晰 -->
        <canvas id="preview" width="2560" height="1280"></canvas>
      </div>
      <div class="actions">
        <button class="btn primary" id="btn-download"><span class="ic">↓</span>下载 PNG</button>
        <button class="btn" id="btn-copy"><span class="ic">⧉</span>复制</button>
        <button class="btn" id="btn-random"><span class="ic">↻</span>随机</button>
      </div>
      <p class="smallprint">本地生成，不上传数据<span class="dot">·</span>MIT<span class="dot">·</span>© Faust-cloud</p>
    </section>

  </main>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================
   ReadmeHero — 核心逻辑
   全部在浏览器本地运行，不上传任何数据。
   ============================================================ */

/* ---------- 画布基本参数 ---------- */
const W = 1280, H = 640;          // 逻辑尺寸（GitHub 推荐的社交预览图尺寸）
const SCALE = 2;                  // 2 倍分辨率，图更清晰
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');

/* ---------- 小工具函数 ---------- */

// hex -> {r,g,b}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

// 按比例调亮/调暗（amount: -1 ~ 1）
function shade(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const t = amount < 0 ? 0 : 255;
  const p = Math.abs(amount);
  const ch = v => Math.round((t - v) * p + v);
  const toHex = v => v.toString(16).padStart(2, '0');
  return '#' + toHex(ch(r)) + toHex(ch(g)) + toHex(ch(b));
}

// 根据背景色判断用深色还是浅色文字
function readableInk(hex) {
  const { r, g, b } = hexToRgb(hex);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.6 ? '#1b1e24' : '#ffffff';
}

function rgba(hex, a) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// 文字换行：把 text 按最大宽度拆成多行，最多 maxLines 行
function wrapLines(text, font, maxWidth, maxLines) {
  ctx.font = font;
  const chars = Array.from(text);
  const lines = [];
  let line = '';
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
      if (lines.length === maxLines - 1) break;
    } else {
      line = test;
    }
  }
  // 处理剩余字符（可能需要省略号）
  let rest = chars.slice(lines.join('').length).join('');
  if (lines.length < maxLines) {
    if (ctx.measureText(rest).width > maxWidth) {
      while (rest && ctx.measureText(rest + '…').width > maxWidth) rest = rest.slice(0, -1);
      rest += '…';
    }
    if (rest) lines.push(rest);
  }
  return lines;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 模板定义 ----------
   每个模板是一个 draw(o) 函数，o = {name, subtitle, author, accent, emoji}
   所有坐标用逻辑尺寸（1280×640），渲染前已 scale(2)。
*/
const SANS = '"PingFang SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
const MONO = '"SF Mono", "JetBrains Mono", Menlo, Consolas, monospace';

const TEMPLATES = {
  /* 1. 极简白 */
  minimal: {
    label: '极简白',
    draw(o) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = o.accent;
      ctx.fillRect(0, 0, 14, H);
      ctx.fillStyle = rgba(o.accent, 0.06);
      roundRect(W - 360, -160, 400, 400, 200); ctx.fill();

      const padL = 96;
      if (o.emoji) { ctx.font = '92px ' + SANS; ctx.textAlign = 'left'; ctx.fillText(o.emoji, padL, 190); }
      ctx.fillStyle = '#15181d';
      ctx.font = '700 86px ' + SANS;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      wrapLines(o.name, '700 86px ' + SANS, W - padL - 110, 1)
        .forEach((l, i) => ctx.fillText(l, padL, 320 + i * 96));
      ctx.fillStyle = '#6a717c';
      const subFont = '400 34px ' + SANS;
      wrapLines(o.subtitle, subFont, W - padL - 110, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, padL, 388 + i * 48); });
      if (o.author) { ctx.fillStyle = o.accent; ctx.font = '600 26px ' + MONO; ctx.fillText(o.author, padL, H - 66); }
    }
  },

  /* 2. 科技深 */
  tech: {
    label: '科技深',
    draw(o) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#0b1020'); g.addColorStop(1, '#131a2e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W - 220, 160, 20, W - 220, 160, 520);
      glow.addColorStop(0, rgba(o.accent, 0.55)); glow.addColorStop(1, rgba(o.accent, 0));
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      const padL = 96;
      if (o.emoji) {
        const tagW = 72; ctx.fillStyle = rgba(o.accent, 0.18);
        roundRect(padL, 92, tagW, 64, 16); ctx.fill();
        ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '36px ' + SANS;
        ctx.fillText(o.emoji, padL + tagW / 2, 136);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff'; ctx.font = '800 90px ' + SANS;
      wrapLines(o.name, '800 90px ' + SANS, W - padL - 90, 1)
        .forEach((l, i) => ctx.fillText(l, padL, 328 + i * 98));
      ctx.fillStyle = o.accent; ctx.fillRect(padL, 352, 120, 8);
      ctx.fillStyle = '#aeb6c7';
      const subFont = '400 34px ' + SANS;
      wrapLines(o.subtitle, subFont, W - padL - 90, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, padL, 420 + i * 48); });
      if (o.author) { ctx.fillStyle = rgba('#ffffff', 0.55); ctx.font = '500 26px ' + MONO; ctx.fillText(o.author, padL, H - 60); }
    }
  },

  /* 3. 活力渐变 */
  vibrant: {
    label: '活力渐变',
    draw(o) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, shade(o.accent, 0.15)); g.addColorStop(1, shade(o.accent, -0.35));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = rgba('#ffffff', 0.10);
      roundRect(-120, H - 220, 520, 520, 260); ctx.fill();
      roundRect(W - 300, -200, 460, 460, 230); ctx.fill();

      const ink = readableInk(shade(o.accent, -0.1));
      ctx.textAlign = 'center';
      if (o.emoji) { ctx.font = '96px ' + SANS; ctx.fillText(o.emoji, W / 2, 210); }
      ctx.fillStyle = ink; ctx.font = '800 92px ' + SANS;
      wrapLines(o.name, '800 92px ' + SANS, W - 200, 1)
        .forEach((l, i) => ctx.fillText(l, W / 2, (o.emoji ? 340 : 300) + i * 98));
      ctx.fillStyle = rgba(ink === '#ffffff' ? '#ffffff' : '#1b1e24', 0.82);
      const subFont = '500 34px ' + SANS;
      wrapLines(o.subtitle, subFont, W - 260, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, W / 2, (o.emoji ? 408 : 368) + i * 48); });
      if (o.author) { ctx.fillStyle = rgba(ink === '#ffffff' ? '#ffffff' : '#1b1e24', 0.7); ctx.font = '600 26px ' + MONO; ctx.fillText(o.author, W / 2, H - 56); }
    }
  },

  /* 4. 极客终端 */
  terminal: {
    label: '极客终端',
    draw(o) {
      ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
      const mx = 80, my = 70, win = { x: mx, y: my, w: W - mx * 2, h: H - my * 2 };
      ctx.fillStyle = '#161b22'; roundRect(win.x, win.y, win.w, win.h, 18); ctx.fill();
      ctx.strokeStyle = '#2a3139'; ctx.lineWidth = 1.5; roundRect(win.x, win.y, win.w, win.h, 18); ctx.stroke();
      const dots = ['#ff5f56', '#ffbd2e', '#27c93f'];
      dots.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(win.x + 36 + i * 30, win.y + 36, 9, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = '#596273'; ctx.font = '22px ' + MONO; ctx.textAlign = 'center';
      ctx.fillText('readme.md', win.x + win.w / 2, win.y + 44);

      const px = win.x + 52; let py = win.y + 130;
      ctx.textAlign = 'left';
      ctx.font = '28px ' + MONO; ctx.fillStyle = o.accent; ctx.fillText('$', px, py);
      ctx.fillStyle = '#8b949e'; ctx.fillText(' npx create ' + (o.author || 'project'), px + 28, py);
      py += 70;
      ctx.fillStyle = o.accent; ctx.font = '700 40px ' + MONO; ctx.fillText('#', px, py + 8);
      ctx.fillStyle = '#e6edf3'; ctx.font = '700 60px ' + MONO;
      wrapLines(o.name, '700 60px ' + MONO, win.w - 160, 1)
        .forEach(l => ctx.fillText(l + (o.emoji ? ' ' + o.emoji : ''), px + 54, py + 16));
      py += 86;
      ctx.fillStyle = '#7d8590';
      const subFont = '400 30px ' + MONO;
      wrapLines('> ' + o.subtitle, subFont, win.w - 120, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, px, py + i * 44); });
      ctx.fillStyle = o.accent; ctx.fillRect(px, py + 76, 18, 32);
    }
  },

  /* 5. 杂志感 */
  editorial: {
    label: '杂志感',
    draw(o) {
      ctx.fillStyle = '#f7f4ee'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = o.accent; ctx.fillRect(W - 260, 0, 260, H);
      if (o.emoji) { ctx.textAlign = 'center'; ctx.font = '120px ' + SANS; ctx.fillText(o.emoji, W - 130, H / 2 + 10); }
      const padL = 90; ctx.textAlign = 'left';
      ctx.fillStyle = o.accent; ctx.font = '700 22px ' + MONO; ctx.fillText('OPEN SOURCE PROJECT', padL, 128);
      ctx.strokeStyle = '#1b1e24'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(padL, 150); ctx.lineTo(W - 300, 150); ctx.stroke();
      ctx.fillStyle = '#15181d'; ctx.font = '800 94px Georgia, "Songti SC", serif';
      wrapLines(o.name, '800 94px Georgia, "Songti SC", serif', W - 300 - padL, 2)
        .forEach((l, i) => ctx.fillText(l, padL, 290 + i * 96));
      ctx.fillStyle = '#55504a';
      const subFont = 'italic 400 34px Georgia, "Songti SC", serif';
      wrapLines(o.subtitle, subFont, W - 300 - padL, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, padL, H - 150 + i * 46); });
      if (o.author) { ctx.fillStyle = '#1b1e24'; ctx.font = '700 24px ' + MONO; ctx.fillText(o.author, padL, H - 70); }
    }
  },

  /* 6. 几何海报 */
  geometric: {
    label: '几何海报',
    draw(o) {
      ctx.fillStyle = '#f5f2ec'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = o.accent; ctx.beginPath(); ctx.arc(W - 150, 120, 230, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = o.accent; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(130, H - 70, 150, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = shade(o.accent, -0.2); ctx.beginPath(); ctx.arc(W - 120, H - 150, 46, 0, Math.PI * 2); ctx.fill();

      const padL = 96; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      if (o.emoji) { ctx.font = '80px ' + SANS; ctx.fillText(o.emoji, padL, 185); }
      ctx.fillStyle = '#15181d'; ctx.font = '900 96px ' + SANS;
      wrapLines(o.name, '900 96px ' + SANS, W - padL - 380, 2)
        .forEach((l, i) => ctx.fillText(l, padL, 320 + i * 94));
      ctx.fillStyle = '#5b5f66';
      const subFont = '500 32px ' + SANS;
      wrapLines(o.subtitle, subFont, W - padL - 400, 2)
        .forEach((l, i) => { ctx.font = subFont; ctx.fillText(l, padL, 408 + i * 46); });
      if (o.author) {
        ctx.font = '600 24px ' + MONO;
        const tagW = ctx.measureText(o.author).width + 44;
        ctx.fillStyle = o.accent; roundRect(padL, H - 112, tagW, 50, 25); ctx.fill();
        ctx.fillStyle = readableInk(o.accent); ctx.textBaseline = 'middle';
        ctx.fillText(o.author, padL + 22, H - 86); ctx.textBaseline = 'alphabetic';
      }
    }
  }
};

/* ---------- 预设配色 & emoji ---------- */
const PRESET_COLORS = ['#6366f1', '#ff5a36', '#0ea5e9', '#22c55e', '#f59e0b', '#ec4899', '#14b8a6', '#1b1e24'];
const PRESET_EMOJIS = ['🚀', '⚡', '🛠️', '📦', '✨', '🧩', '🔥', '🤖'];

/* ---------- 应用状态 ---------- */
const state = {
  name: 'ReadmeHero',
  subtitle: '一键生成好看的 GitHub 项目封面图',
  author: '@Faust-cloud',
  template: 'tech',
  accent: '#6366f1',
  emoji: '🚀'
};

/* ---------- 渲染 ---------- */
function render() {
  ctx.save();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';
  TEMPLATES[state.template].draw(state);
  ctx.restore();
}

/* ---------- 构建 UI ---------- */
function buildTemplates() {
  const box = document.getElementById('templates');
  box.innerHTML = '';
  Object.entries(TEMPLATES).forEach(([id, t]) => {
    const el = document.createElement('div');
    el.className = 'tpl' + (id === state.template ? ' active' : '');
    el.textContent = t.label;
    el.onclick = () => {
      state.template = id;
      document.querySelectorAll('.tpl').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      render();
    };
    box.appendChild(el);
  });
}

function buildSwatches() {
  const box = document.getElementById('swatches');
  box.innerHTML = '';
  PRESET_COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'swatch' + (c === state.accent ? ' active' : '');
    el.style.background = c;
    el.onclick = () => { setAccent(c); };
    box.appendChild(el);
  });
  const custom = document.createElement('div');
  custom.className = 'swatch custom';
  custom.title = '自定义颜色';
  const picker = document.createElement('input');
  picker.type = 'color';
  picker.value = state.accent;
  picker.oninput = e => setAccent(e.target.value, true);
  custom.appendChild(picker);
  box.appendChild(custom);
}

function setAccent(c, isCustom) {
  state.accent = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  if (!isCustom) {
    const idx = PRESET_COLORS.indexOf(c);
    const el = document.querySelectorAll('.swatch')[idx];
    if (el) el.classList.add('active');
  }
  render();
}

function buildEmojis() {
  const box = document.getElementById('emojis');
  box.innerHTML = '';
  PRESET_EMOJIS.forEach(em => {
    const el = document.createElement('button');
    el.className = 'emoji-btn' + (em === state.emoji ? ' active' : '');
    el.textContent = em;
    el.onclick = () => {
      state.emoji = em;
      document.getElementById('in-emoji').value = em;
      document.querySelectorAll('.emoji-btn').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      render();
    };
    box.appendChild(el);
  });
}

/* ---------- 绑定输入 ---------- */
function bindInputs() {
  document.getElementById('in-name').oninput = e => { state.name = e.target.value; render(); };
  document.getElementById('in-subtitle').oninput = e => { state.subtitle = e.target.value; render(); };
  document.getElementById('in-author').oninput = e => { state.author = e.target.value.trim(); render(); };
  document.getElementById('in-emoji').oninput = e => {
    state.emoji = Array.from(e.target.value)[0] || '';
    document.querySelectorAll('.emoji-btn').forEach(x =>
      x.classList.toggle('active', x.textContent === state.emoji));
    render();
  };
}

/* ---------- 导出 ---------- */
function download() {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safe = (state.name || 'readme-hero').replace(/[^\w一-龥-]+/g, '-').toLowerCase();
    a.href = url;
    a.download = safe + '-banner.png';
    a.click();
    URL.revokeObjectURL(url);
    toast('已下载 PNG ✓');
  }, 'image/png');
}

async function copyToClipboard() {
  try {
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('已复制到剪贴板 ✓');
  } catch (err) {
    toast('这个浏览器不支持复制图片，请用下载按钮');
  }
}

function randomStyle() {
  const ids = Object.keys(TEMPLATES);
  state.template = ids[Math.floor(Math.random() * ids.length)];
  state.accent = PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];
  buildTemplates(); buildSwatches();
  render();
  toast('换了个风格');
}

/* ---------- 提示条 ---------- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- 初始化 ---------- */
document.getElementById('btn-download').onclick = download;
document.getElementById('btn-copy').onclick = copyToClipboard;
document.getElementById('btn-random').onclick = randomStyle;
buildTemplates();
buildSwatches();
buildEmojis();
bindInputs();
render();
</script>

</body>
</html>
